# Venera AI Assistant - yangilanish fayllari uchun nginx bloki.
#
# HOLAT (2026-09-04 da o'lchangan):
#   ccs.venera.uz -> 192.168.77.9   TCP 443 va 80 ochiq, lekin HTTP javob
#                                     bermaydi (timeout). Ya'ni shu hostname
#                                     uchun vhost umuman sozlanmagan yoki
#                                     ishlamayotgan backendga proxy qilyapti.
#   llm.venera.uz -> 192.168.77.9   ishlaydi (SPA, HTTP 200).
#
# Demak ccs uchun avval SERVER BLOKI kerak, keyin quyidagi location.
#
# Diqqat: agar ccs ham llm kabi SPA sifatida sozlansa, `location /` ichidagi
# `try_files $uri $uri/ /index.html` tufayli MAVJUD BO'LMAGAN yo'l ham
# HTTP 404 emas, HTTP 200 + index.html qaytaradi:
#
#     GET /assistant/version.json  ->  200, text/html, 999 bayt
#
# Bu yangilanish uchun eng yashirin nosozlik - mijoz "muvaffaqiyat" deb
# o'ylab HTML sahifani version.json yoki o'rnatuvchi deb qabul qilishi mumkin.
# (Mijoz tomonda 0.2.2 dan boshlab himoya bor - HTML rad etiladi va sha256
#  tekshiriladi - lekin server halol 404 qaytarsa ancha toza bo'ladi.)

location /assistant/ {
    # Fayllar shu papkada bo'ladi:  /var/www/venera/assistant/
    # `alias` emas, `root` - `alias` + `try_files` juftligi nginx'da
    # tarixan nosoz ishlagan, `root` bilan bunday muammo yo'q.
    root /var/www/venera;

    # ENG MUHIM QATOR: fayl yo'q bo'lsa halol 404, index.html EMAS.
    try_files $uri =404;

    # Papka ro'yxatini ko'rsatmaslik.
    autoindex off;

    # version.json keshlanmasin, aks holda proksi eski versiyani ushlab qoladi
    # va kompyuterlar yangilanish chiqqanini bilmaydi.
    add_header Cache-Control "no-store" always;

    # 45 MB o'rnatuvchi uchun yetarli vaqt (sekin ulanishlar bor).
    send_timeout 300s;
}
