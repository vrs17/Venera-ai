# Container server block for the Venera frontend.
# Shipped as an envsubst TEMPLATE: the official nginx entrypoint renders
# /etc/nginx/templates/*.template -> /etc/nginx/conf.d/ at startup, substituting
# ONLY defined env vars (${API_UPSTREAM}, ${API_READ_TIMEOUT}); nginx runtime
# variables like $host / $uri are left untouched.
#
# Served by nginx-unprivileged: non-root (uid 101), listens on :8080.
# Security headers live at the SERVER level and are inherited by every location
# because no location uses `add_header` (caching is done with `expires`, which does
# NOT break add_header inheritance the way a location-level add_header would). This
# is what guarantees the CSP reaches the HTML document served by `location /`.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (inherited by all locations below) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # microphone=(self): the voice panel records in the browser. `()` here
    # forbids the microphone for the whole origin - the browser then rejects
    # getUserMedia() WITHOUT showing a prompt, and the padlock menu cannot
    # override it, so it looks like a permission the user refused. Only our own
    # origin may use it; the rest stay locked.
    add_header Permissions-Policy     "geolocation=(), microphone=(self), camera=(), payment=()" always;
    # script-src 'self' covers /assets/*.js AND /bootstrap.js — no inline-hash to drift.
    # `media-src ... blob:` MAJBURIY: TTS javobi WAV bo'lib keladi va
    # `URL.createObjectURL()` orqali `<audio>` ga beriladi. `default-src 'self'`
    # blob: sxemasini QAMRAMAYDI - usiz ovoz faqat ishlab chiqarishda, jimgina
    # bloklanardi (Vite dev-serverda CSP yo'q, ya'ni lokalda ishlab ko'rinardi).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # --- Health endpoint: liveness + readiness, NO backend dependency ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Hashed, immutable assets (filenames change on every build) ---
    location /assets/ {
        expires 1y;            # sets Cache-Control without add_header (keeps header inheritance)
        try_files $uri =404;
    }

    # --- Desktop yuklab olish ---------------------------------------------------
    # Fayllar konteynerga read-only bind-mount qilinadi (systemd unit'da:
    #   -v %h/.local/share/venera/downloads:/usr/share/nginx/downloads:ro,z ).
    # $HOME, /var/www EMAS: bu rootless user-service, root papkasini o'qiy olmaydi.
    # Bu AYNAN desktop ilova auto-update uchun o'qiydigan papka: bitta fayl, ikkita
    # yo'l. Shuning uchun saytdagi versiya update manifestidan farq qila olmaydi,
    # va 45 MB .exe konteyner image'iga tushmaydi — yangi versiya qo'yish uchun
    # image'ni qayta yig'ish kerak emas, faylni papkaga nusxalash yetarli.
    #
    # ATAYLAB uchta alohida location (ichma-ich emas): nginx avval `=` ni,
    # keyin regex'ni, oxirida prefiksni tanlaydi. Natijada FAQAT version.json,
    # *.exe va *.dmg ochiq; /download/ ostidagi boshqa hamma narsa 404. Papka
    # ro'yxati (autoindex) hech qachon ochilmaydi.

    # Manifest KESHLANMAYDI: u yangi versiya chiqqanini bildiradigan yagona signal.
    # Eski manifest = mavjud bo'lmagan faylga havola.
    location = /download/version.json {
        alias /usr/share/nginx/downloads/version.json;
        default_type application/json;
        expires -1;
    }

    # O'rnatuvchi fayllar: Windows .exe va macOS .dmg. Nomi versiya bilan
    # o'zgaradi (Venera-...-Setup-0.2.4.exe, Venera-...-0.2.4-universal.dmg),
    # ya'ni immutable — uzoq keshlash xavfsiz. Nom naqshi qat'iy cheklangan,
    # shuning uchun `..` yoki `/` bilan papkadan chiqib bo'lmaydi.
    #
    # Kengaytmalar ATAYLAB ochiq ro'yxat: papkaga tasodifan tushgan boshqa
    # fayl (log, zip, kalit) hech qachon tarqatilmaydi.
    location ~ ^/download/(?<setup_file>[A-Za-z0-9._-]+\.(?:exe|dmg))$ {
        alias /usr/share/nginx/downloads/$setup_file;
        default_type application/octet-stream;
        expires 30d;
        # Brauzer ochishga urinmasin, faylga saqlasin.
        add_header Content-Disposition "attachment" always;
        # DIQQAT: bu location'da add_header ishlatilgani uchun server darajasidagi
        # sarlavhalar MEROS BO'LMAYDI. Binar fayl uchun ma'nosi borlarini
        # qaytaramiz (CSP yuklab olinadigan faylga taalluqli emas).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Qolgan hamma narsa yopiq. `try_files` emas, to'g'ridan-to'g'ri 404 — SPA
    # fallback'ga tushib, .exe o'rniga index.html qaytarilishining oldini oladi.
    location /download/ {
        return 404;
    }

    # --- API → backend (upstream injected at RUNTIME; empty default fails closed) ---
    location /api/ {
        # Voice uploads: a 30 s turn as 16 kHz mono WAV is ~960 KB; the API's
        # own limit is 10 MB. nginx's default is 1 MB, which would have cut
        # every longer recording off here with a bare 413 and no JSON envelope.
        client_max_body_size 12m;
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser sends Origin on same-origin POSTs. Forwarding it makes the
        # backend run its CORS allowlist check, which only permits localhost /
        # 127.0.0.1 -- so every LAN user (Origin: http://10.10.10.8:5173) got
        # 403 "Invalid CORS request" on login. This hop is server-to-server, so
        # blank the header: the backend then sees a non-CORS request and applies
        # normal auth. (Proper long-term fix: add the real origin to the backend
        # allowlist; this keeps LAN users working meanwhile.)
        proxy_set_header Origin            "";
        proxy_read_timeout ${API_READ_TIMEOUT};
    }

    # --- SPA fallback: index.html must NOT be cached ---
    location / {
        expires -1;            # Cache-Control: no-cache, without add_header
        try_files $uri /index.html;
    }
}
