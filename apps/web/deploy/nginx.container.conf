# Container server block for the Venera frontend.
# Shipped as an envsubst TEMPLATE: the official nginx entrypoint renders
# /etc/nginx/templates/*.template -> /etc/nginx/conf.d/ at startup, substituting
# ONLY defined env vars (${API_UPSTREAM}, ${API_READ_TIMEOUT}); nginx runtime
# variables like $host / $uri are left untouched.
#
# Served by nginx-unprivileged: non-root (uid 101), listens on :8080.
# Security headers live at the SERVER level and are inherited by every location
# because no location uses `add_header` (caching is done with `expires`, which does
# NOT break add_header inheritance the way a location-level add_header would). This
# is what guarantees the CSP reaches the HTML document served by `location /`.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (inherited by all locations below) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # microphone=(self): the voice panel records in the browser. `()` here
    # forbids the microphone for the whole origin - the browser then rejects
    # getUserMedia() WITHOUT showing a prompt, and the padlock menu cannot
    # override it, so it looks like a permission the user refused. Only our own
    # origin may use it; the rest stay locked.
    add_header Permissions-Policy     "geolocation=(), microphone=(self), camera=(), payment=()" always;
    # script-src 'self' covers /assets/*.js AND /bootstrap.js — no inline-hash to drift.
    # `media-src ... blob:` MAJBURIY: TTS javobi WAV bo'lib keladi va
    # `URL.createObjectURL()` orqali `<audio>` ga beriladi. `default-src 'self'`
    # blob: sxemasini QAMRAMAYDI - usiz ovoz faqat ishlab chiqarishda, jimgina
    # bloklanardi (Vite dev-serverda CSP yo'q, ya'ni lokalda ishlab ko'rinardi).
    # `connect-src ... *.livekit.cloud` - jonli ovozli suhbat (/barno): brauzer Speko agentiga LiveKit orqali
    # ulanadi (signal - WebSocket `wss://<loyiha>.livekit.cloud`, mintaqa ro'yxati - HTTPS shu xostdan; manzilni
    # server har sessiyada beradi - `apps/api/app/api/v1/live.py`). Ovozning o'zi WebRTC (UDP) - CSP unga
    # tegmaydi. Busiz ulanish faqat ishlab chiqarishda, jimgina bloklanardi (Vite dev-serverda CSP yo'q).
    # Speko agentni boshqa transportga (Daily) o'tkazsa - uning xostlari ham shu yerga qo'shiladi.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://*.livekit.cloud wss://*.livekit.cloud; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # --- Health endpoint: liveness + readiness, NO backend dependency ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Hashed, immutable assets (filenames change on every build) ---
    location /assets/ {
        expires 1y;            # sets Cache-Control without add_header (keeps header inheritance)
        # nginx'ning standart `mime.types` ida `.wav` YO'Q (u yerdagi yagona
        # "wav" - `x-shockwave-flash`). Ya'ni tayyorlangan salomlashish audiosi
        # `application/octet-stream` bo'lib ketardi, `<audio>` esa noma'lum
        # turdagi manbani ijro etishdan bosh tortishi mumkin. Blok `types`
        # ni KENGAYTIRMAYDI, ALMASHTIRADI - shuning uchun bu yerda beriladigan
        # boshqa kengaytmalar ham sanab o'tilgan.
        types {
            text/css                css;
            text/javascript         js mjs;
            application/json        json map;
            image/svg+xml           svg;
            image/png               png;
            image/jpeg              jpg jpeg;
            image/webp              webp;
            image/gif               gif;
            image/x-icon            ico;
            font/woff2              woff2;
            font/woff               woff;
            audio/wav               wav;
            audio/mpeg              mp3;
            audio/ogg               ogg opus;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # --- Desktop yuklab olish ---------------------------------------------------
    # Fayllar konteynerga read-only bind-mount qilinadi (systemd unit'da:
    #   -v %h/.local/share/venera/downloads:/usr/share/nginx/downloads:ro,z ).
    # $HOME, /var/www EMAS: bu rootless user-service, root papkasini o'qiy olmaydi.
    # Bu AYNAN desktop ilova auto-update uchun o'qiydigan papka: bitta fayl, ikkita
    # yo'l. Shuning uchun saytdagi versiya update manifestidan farq qila olmaydi,
    # va 45 MB .exe konteyner image'iga tushmaydi — yangi versiya qo'yish uchun
    # image'ni qayta yig'ish kerak emas, faylni papkaga nusxalash yetarli.
    #
    # ATAYLAB uchta alohida location (ichma-ich emas): nginx avval `=` ni,
    # keyin regex'ni, oxirida prefiksni tanlaydi. Natijada FAQAT version.json,
    # *.exe va *.dmg ochiq; /download/ ostidagi boshqa hamma narsa 404. Papka
    # ro'yxati (autoindex) hech qachon ochilmaydi.

    # Manifest KESHLANMAYDI: u yangi versiya chiqqanini bildiradigan yagona signal.
    # Eski manifest = mavjud bo'lmagan faylga havola.
    location = /download/version.json {
        alias /usr/share/nginx/downloads/version.json;
        default_type application/json;
        expires -1;
    }

    # O'rnatuvchi fayllar: Windows .exe va macOS .dmg. Nomi versiya bilan
    # o'zgaradi (Venera-...-Setup-0.2.4.exe, Venera-...-0.2.4-universal.dmg),
    # ya'ni immutable — uzoq keshlash xavfsiz. Nom naqshi qat'iy cheklangan,
    # shuning uchun `..` yoki `/` bilan papkadan chiqib bo'lmaydi.
    #
    # Kengaytmalar ATAYLAB ochiq ro'yxat: papkaga tasodifan tushgan boshqa
    # fayl (log, zip, kalit) hech qachon tarqatilmaydi.
    location ~ ^/download/(?<setup_file>[A-Za-z0-9._-]+\.(?:exe|dmg))$ {
        alias /usr/share/nginx/downloads/$setup_file;
        default_type application/octet-stream;
        expires 30d;
        # Brauzer ochishga urinmasin, faylga saqlasin.
        add_header Content-Disposition "attachment" always;
        # DIQQAT: bu location'da add_header ishlatilgani uchun server darajasidagi
        # sarlavhalar MEROS BO'LMAYDI. Binar fayl uchun ma'nosi borlarini
        # qaytaramiz (CSP yuklab olinadigan faylga taalluqli emas).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Qolgan hamma narsa yopiq. `try_files` emas, to'g'ridan-to'g'ri 404 — SPA
    # fallback'ga tushib, .exe o'rniga index.html qaytarilishining oldini oladi.
    location /download/ {
        return 404;
    }

    # --- TTS oqimi: BUFERLASH O'CHIQ -------------------------------------------
    # nginx sukut bo'yicha butun javobni yig'ib, keyin bir yo'la beradi. Ovoz
    # uchun bu streaming'ni BUTUNLAY bekor qiladi: birinchi bayt 1.1 s o'rniga
    # butun sintez tugagach (~11 s) kelardi, ya'ni yuqoridagi barcha ish
    # behuda ketardi. Bu `location` faqat shuning uchun ajratilgan.
    #
    # `add_header` ATAYLAB ISHLATILMAYDI - u server darajasidagi xavfsizlik
    # sarlavhalari merosini uzib qo'yardi (CSP, nosniff va boshqalar).
    location = /api/v1/tts/speak {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        # Bo'laklar orasidagi kutish. Sintez GPU navbatida turishi mumkin,
        # lekin bo'laklar odatda 1-2 s oralab keladi.
        proxy_read_timeout ${API_READ_TIMEOUT};
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";
        # `Connection` ni bo'shatish `keepalive` uchun emas, chunked javob
        # to'g'ri o'tishi uchun.
        proxy_set_header Connection        "";
    }

    # Savol-javob oqimi - AYNAN shu sababdan alohida `location`.
    #
    # Javob NDJSON: har qatorda bitta kadr, va ular yozilishi bilan
    # yuboriladi. Buferlash yoqiq bo'lsa nginx butun javobni yig'ib, oxirida
    # bir yo'la beradi - ya'ni odam javob yozilayotganini KO'RMAYDI va
    # oqimning butun ma'nosi qolmaydi. Yuqoridagi xizmat hujjati ham shuni
    # talab qiladi: "no redirect, no buffering, no compression".
    #
    # Siqish ham o'chirilgan: gzip o'z buferiga to'plab, kadrlarni to'da-to'da
    # chiqaradi.
    #
    # `add_header` ATAYLAB ISHLATILMAYDI - u server darajasidagi xavfsizlik
    # sarlavhalari merosini uzib qo'yardi (CSP, nosniff va boshqalar).
    location = /api/v1/chat/stream {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        # Kadrlar ORASIDAGI kutish. LLM javobi bir daqiqadan oshishi normal,
        # shuning uchun bu TTS dagidan uzun.
        proxy_read_timeout 180s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";
        # `Connection` ni bo'shatish `keepalive` uchun emas, chunked javob
        # to'g'ri o'tishi uchun.
        proxy_set_header Connection        "";
    }

    # --- Barno konnektori (Claude / ChatGPT) - `docs/barno-connector.md` ---------
    # MCP (`/mcp`), OAuth eshigi (`/oauth/*`) va uning metadata si (`/.well-known/oauth-*`)
    # API ning ILDIZIDA (standart shunday kutadi). Bosh kalit o'chiq bo'lsa API o'zi 404 beradi.
    # Bufer va siqish o'chiq - javob kelishi bilan o'tsin. `/mcp` da Origin O'TADI: MCP serveri
    # uni o'zi tekshiradi (claude.ai, claude.com, chatgpt.com va o'zimiz - DNS-rebinding qoidasi);
    # `/oauth/*` da `/api/` dagi kabi bo'shatiladi (u yerda Origin tekshiruvi yo'q).
    location = /mcp {
        client_max_body_size 1m;
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location /oauth/ {
        client_max_body_size 64k;
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";
        proxy_read_timeout 30s;
    }

    location /.well-known/oauth- {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Origin            "";
        proxy_read_timeout 10s;
    }

    # --- API → backend (upstream injected at RUNTIME; empty default fails closed) ---
    location /api/ {
        # Voice uploads: a 30 s turn as 16 kHz mono WAV is ~960 KB; the API's
        # own limit is 10 MB. nginx's default is 1 MB, which would have cut
        # every longer recording off here with a bare 413 and no JSON envelope.
        client_max_body_size 12m;
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser sends Origin on same-origin POSTs. Forwarding it makes the
        # backend run its CORS allowlist check, which only permits localhost /
        # 127.0.0.1 -- so every LAN user (Origin: http://10.10.10.8:5173) got
        # 403 "Invalid CORS request" on login. This hop is server-to-server, so
        # blank the header: the backend then sees a non-CORS request and applies
        # normal auth. (Proper long-term fix: add the real origin to the backend
        # allowlist; this keeps LAN users working meanwhile.)
        proxy_set_header Origin            "";
        proxy_read_timeout ${API_READ_TIMEOUT};
    }

    # --- Telegram Mini App (/tg/) ----------------------------------------------
    # Mini App web kod bazasida (apps/web/src/tg, tg-app.html) va IMAGE ICHIDA:
    # `vite build` uni dist/ ga web bilan birga yig'adi. Har qanday /tg/... yo'li
    # bitta sahifaga tushadi (ichki holat mashinasi, router yo'q); JS/CSS/shriftlar
    # odatdagi /assets/ dan (immutable kesh). Eski ikki faylli ilova (host mount
    # `~/.local/share/venera-tg`) endi ishlatilmaydi - qaytarish kerak bo'lsa,
    # `root` + `try_files` ni eski `alias /usr/share/nginx/tg/; index index.html;`
    # ga almashtiring (mount systemd unit'da hali turibdi).
    #
    # DIQQAT: bu location'da add_header ishlatilgani uchun server darajasidagi
    # sarlavhalar MEROS BO'LMAYDI - aynan shu kerak. Telegram Mini App'ni
    # iframe'da ochadi, server darajasidagi `X-Frame-Options: DENY` va CSP
    # `frame-ancestors 'none'` esa uni butunlay to'sardi. Kerakli sarlavhalar
    # quyida QAYTA e'lon qilinadi.
    # `absolute_redirect off`: usiz nginx Location'ni o'zi yig'adi va
    # konteynerning ICHKI porti chiqib qoladi (http://host:8080/tg/) -
    # ya'ni https sahifadan http ga tushirib yuborardi. Nisbiy manzil
    # sxema va domenni brauzerning o'ziga qoldiradi.
    location = /tg {
        absolute_redirect off;
        return 301 /tg/;
    }

    location /tg/ {
        root /usr/share/nginx/html;
        try_files /tg-app.html =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Orb mikrofondan foydalanadi - ilovaning o'zi bilan bir xil ruxsat.
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(), payment=()" always;

        # Ilovaning siyosati bilan bir xil, ATAYLAB ikkita farq bilan:
        #   script-src    + https://telegram.org  -> Mini App SDK (telegram-web-app.js)
        #   frame-ancestors 'none' O'RNIGA telegram -> Telegram Web/Desktop iframe ishlatadi
        # (Telefonda Telegram WebView ishlatadi, unga frame-ancestors ta'sir qilmaydi.)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; object-src 'none'" always;

        # X-Frame-Options ATAYLAB YO'Q: unda origin ro'yxati yo'q, ya'ni
        # DENY/SAMEORIGIN Telegram Web'ni butunlay to'sardi. Yuqoridagi
        # frame-ancestors o'sha ishni oq ro'yxat bilan bajaradi.

        # Telegram WebView qattiq keshlaydi - yangilangan sahifa o'tkazib
        # yuborilmasin.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- Yangi Telegram Mini App - BETA (/tg-beta/) ----------------------------
    # Almashtirishdan keyin /tg/ bilan BIR XIL sahifa. Saqlanadi: sinovchilar
    # Telegram'da ochgan eski /tg-beta/ tugmalari va havolalari ishlashda davom etsin.
    # Bot /beta ni olib tashlagach, bu location'ni ham olib tashlash mumkin.
    #
    # Har qanday /tg-beta/... yo'li bitta sahifaga tushadi (ichki holat mashinasi,
    # router yo'q). `try_files` faylni SHU location ichida beradi (ichki redirect
    # emas), ya'ni pastdagi sarlavhalar unga qo'yiladi. JS/CSS/shriftlar web bilan
    # umumiy /assets/ dan - immutable kesh, ikkala sahifa bitta nusxani oladi.
    location = /tg-beta {
        absolute_redirect off;
        return 301 /tg-beta/;
    }

    location /tg-beta/ {
        try_files /tg-app.html =404;

        # Sarlavhalar /tg/ dagi bilan BIR XIL va xuddi shu sababdan shu yerda QAYTA
        # e'lon qilinadi: add_header server darajasidagi merosni uzadi, server
        # darajasidagi `X-Frame-Options: DENY` va `frame-ancestors 'none'` esa
        # Telegram Web/Desktop iframe'ini butunlay to'sardi.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Diktovka mikrofondan foydalanadi - ilovaning o'zi bilan bir xil ruxsat.
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(), payment=()" always;
        # /tg/ siyosati: + https://telegram.org (SDK), frame-ancestors - telegram.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; object-src 'none'" always;

        # HTML web'ning index.html'i kabi keshlanmaydi (`location /` dagi
        # `expires -1`): yangi build chiqqanda Telegram WebView eski sahifani - va
        # u ko'rsatgan, endi yo'q /assets/ fayllarini - ushlab qolmasin.
        expires -1;
    }

    # tg-app.html faqat /tg/ va /tg-beta/ orqali ochiladi. To'g'ridan-to'g'ri
    # /tg-app.html so'rovi `location /` ga tushib, WEB siyosati bilan chiqardi -
    # telegram.org SDK bloklangan, ya'ni Telegram'siz yarim ishlaydigan sahifa.
    # Yuqoridagi `try_files /tg-app.html` bunga tushmaydi: u faylni diskdan
    # tekshiradi, location qayta tanlanmaydi.
    location = /tg-app.html {
        return 404;
    }

    # --- SPA fallback: index.html must NOT be cached ---
    location / {
        expires -1;            # Cache-Control: no-cache, without add_header
        try_files $uri /index.html;
    }
}
