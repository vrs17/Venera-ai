# Interfeys matnlari (`i18n.t("kalit")`).
#
# Kalitlar ichma-ich yozilgan, lekin `i18n` ularni NUQTA bilan tekislaydi:
#   window: {button: {submit: ...}}  ->  i18n.t("window.button.submit")
# Xohlasangiz tekis ham yozishingiz mumkin - ikkalasi ham ishlaydi.
#
# `{hotkey}`, `{version}` kabi joy egallovchilar `str.format` bilan
# to'ldiriladi. Boshqa tilga o'girganda ULARNING NOMI o'zgarmaydi.
#
# TARJIMA QILUVCHIGA: yetishmagan kalit ilovani yiqitmaydi - u zaxira tildan
# (`uz`) olinadi va logga bir marta ogohlantirish yoziladi. Shuning uchun
# paketni bosqichma-bosqich to'ldirsa bo'ladi; `locale.yaml` dagi
# `complete: false` shuni bildiradi.

