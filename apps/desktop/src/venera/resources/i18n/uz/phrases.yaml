# bog'langan. Gapdagi TARTIBINI esa xohlagancha o'zgartirsa bo'ladi.
#
# `weekdays` va `months` - RO'YXAT, tartibi qat'iy:
#   weekdays[0] = dushanba (Python `datetime.weekday()` bilan bir xil)
#   months[0]   = yanvar

