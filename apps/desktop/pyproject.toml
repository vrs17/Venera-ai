[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venera"
version = "0.2.8"
description = "Venera AI Assistant - ovozli desktop yordamchi (Step 1: Windows skeleton)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5.2",
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "rapidfuzz>=3.9",
    "pywin32>=306 ; sys_platform == 'win32'",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "pycaw>=20240210 ; sys_platform == 'win32'",
]

[project.scripts]
venera = "venera.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
venera = ["resources/*.yaml", "resources/VERSION", "resources/icons/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
