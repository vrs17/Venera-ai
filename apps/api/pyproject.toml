[project]
name = "venera-api"
version = "0.1.0"
description = "Venera AI - web ilova uchun backend"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "PyJWT>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",        # TestClient shunga tayanadi
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
