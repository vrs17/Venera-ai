[project]
name = "venera-api"
version = "0.1.0"
description = "Venera AI - web ilova uchun backend"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "PyJWT>=2.9",
    "PyYAML>=6.0",
    # `File`/`Form` (ovoz yuklash) busiz ILOVA UMUMAN KO'TARILMAYDI -
    # FastAPI ishga tushishda RuntimeError beradi.
    "python-multipart>=0.0.9",
    # Yig'ilish eksporti (`GET /meetings/{id}/export`): Word va PDF fayl. ANIQ versiya - fayl
    # ko'rinishi kutubxona yangilanishi bilan jim o'zgarmasin. Ikkalasi ham funksiya ichida
    # import qilinadi: o'rnatilmagan serverda faqat shu format 503, ilova ko'tariladi.
    "python-docx==1.2.0",
    "reportlab==4.4.10",
    # Slack ilovasi "Barno AI" (`app/slack/`, Socket Mode). Funksiya ichida import
    # qilinadi: o'rnatilmagan serverda faqat Slack ishlamaydi, ilova ko'tariladi.
    "slack_bolt>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",        # TestClient shunga tayanadi
]

# Paketni ANIQ ko'rsatish shart: papka tekis joylashgan (app/, tests/, config/,
# deploy/ - hammasi ildizda) va setuptools qaysi biri paket ekanini o'zi
# topa olmaydi, "Multiple top-level packages discovered" deb to'xtaydi.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
