<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Venera</title>
<!-- Telegram Mini App SDK. ATAYLAB majburiy emas: `window.Telegram` bo'lmasa
     (oddiy brauzerda ochilsa) sahifa to'liq ishlashda davom etadi. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #050409;
    --fg: #f4f1ff;
    --muted: #a9a3bd;
    --accent: #ff3b30;
    --ok: #6f5cff;
    --warn: #ffd166;
    --good: #57d38c;     /* ulangan - yashil nuqta */
    --ring: rgba(255,255,255,.9);
    --line: rgba(255,255,255,.14);
    --lvl: 0;            /* 0..1 mikrofon darajasi, JS har kadrda yozadi */
    --jx: 0px; --jy: 0px;
    --r1: 50%; --r2: 50%; --r3: 50%; --r4: 50%;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; min-height: 100dvh;
    padding: calc(var(--safe-top) + 10px) 16px calc(var(--safe-bottom) + 12px); user-select: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }

  /* ---------- umumiy ---------- */
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .2px; display: flex; align-items: center; gap: 6px; }
  .brand .spark { color: var(--accent); font-size: 14px; }
  .pill { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
  .pill.warn { color: var(--warn); border-color: rgba(255,209,102,.4); }
  .pill.live { color: var(--accent); border-color: rgba(255,59,48,.45); }
  .iconbtn { background: none; border: 1px solid var(--line); border-radius: 999px;
    width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .iconbtn:active { background: rgba(255,255,255,.08); }
  .iconbtn svg { width: 16px; height: 16px; }

  /* Ovoz kaliti: holat `aria-pressed` da - ya'ni bitta manba, va uni
     skrin-riderlar ham o'qiydi. Ko'rinish faqat CSS bilan kelib chiqadi. */
  .voice .slash { opacity: 0; transition: opacity .15s; }
  .voice .wave { transition: opacity .15s; }
  .voice[aria-pressed="false"] { color: var(--muted); border-color: rgba(255,255,255,.08); }
  .voice[aria-pressed="false"] .wave { opacity: 0; }
  .voice[aria-pressed="false"] .slash { opacity: 1; }

  /* Faqat YUKLANISH ekrani uchun: markazga qo'yish. */
  .stage { flex: 1; display: grid; place-items: center; min-height: 0; }

  /* ---------- mikrofon tugmasi (avvalgi "orb") ---------- */
  /* O'LCHAM ATAYLAB KICHIK: 44px. Avval bu `min(62vw, 300px)` edi va
     ekranning yarmini olardi; keyin 64px bo'ldi, endi esa kiritish paneli
     ichidagi qatorda turgani uchun yana kichraydi. Gradient va tebranish
     saqlandi - ular "men eshityapman" degan yagona ko'rinadigan signal. */
  .orb-wrap { position: relative; width: 44px; height: 44px; flex: none; cursor: pointer; }
  .orb-wrap.big { width: min(34vw, 140px); height: auto; aspect-ratio: 1; cursor: default; }
  .ripple { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(190,200,255,.55);
    opacity: 0; pointer-events: none; }
  .ripple.go { animation: ripple 1.1s ease-out forwards; }

  .orb { position: absolute; inset: 0; border-radius: var(--r1) var(--r2) var(--r3) var(--r4);
    background:
      radial-gradient(circle at 34% 28%, #ffffff 0%, #f6ecff 18%, rgba(246,236,255,0) 45%),
      radial-gradient(circle at 18% 40%, rgba(236,120,255,.95) 0%, rgba(236,120,255,0) 38%),
      radial-gradient(circle at 78% 78%, rgba(90,170,255,.95) 0%, rgba(90,170,255,0) 45%),
      radial-gradient(circle at 60% 60%, #cfe6ff 0%, #a9d7ff 55%, #7dc4ff 100%);
    /* Soya kichik tugmaga moslandi: avvalgi 120px li yoyilish bu o'lchamda
       butun dokni yoritib yuborardi. */
    box-shadow:
      0 0 0 2px var(--ring),
      0 0 calc(14px + var(--lvl) * 26px) rgba(140,160,255, calc(.45 + var(--lvl) * .4)),
      0 0 calc(34px + var(--lvl) * 46px) rgba(100,80,220, calc(.28 + var(--lvl) * .3));
    /* Tebranish ham yumshatildi: 0.14 kichik tugmani sakratib yuborardi. */
    transform: translate(var(--jx), var(--jy)) scale(calc(1 + var(--lvl) * .08));
    transition: border-radius .09s linear, transform .07s linear, box-shadow .12s ease-out;
    overflow: hidden; }
  .orb::before { content: ""; position: absolute; inset: -30%; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255,120,240,.35), rgba(120,220,255,.35), rgba(255,255,255,.25), rgba(150,120,255,.35), rgba(255,120,240,.35));
    animation: spin 14s linear infinite; mix-blend-mode: soft-light; }
  .orb-wrap.speaking .orb::before { animation-duration: 5s; }
  .orb-wrap.thinking .orb, .orb-wrap.transcribing .orb { animation: breathe 1.6s ease-in-out infinite; }
  .orb-wrap.idle .orb, .orb-wrap.confirm .orb { animation: breathe 5s ease-in-out infinite; }
  .orb-wrap:active .orb { transform: translate(var(--jx), var(--jy)) scale(.94); }

  /* Ikonkalar: mikrofon odatda, to'rtburchak - bosish TO'XTATADIGAN
     holatlarda. Almashish faqat CSS bilan, JS tegmaydi. */
  .icon { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    transition: opacity .15s; }
  .icon svg { width: 19px; height: 19px; }
  .mic { color: #1a1730; opacity: 1; }
  .orb-wrap.listening .mic { color: var(--accent); animation: blink 1s ease-in-out infinite; }
  .stop { color: #1a1730; opacity: 0; }
  .orb-wrap.thinking .mic, .orb-wrap.transcribing .mic, .orb-wrap.speaking .mic { opacity: 0; }
  .orb-wrap.thinking .stop, .orb-wrap.transcribing .stop, .orb-wrap.speaking .stop { opacity: 1; }

  /* ---------- pastki dok ---------- */
  .dock { display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding-top: 10px; flex: none; }

  /* Kiritish paneli. Tugmalar `flex-end` da: matn bir necha qatorga o'ssa
     ular pastda, oxirgi qator bilan bir tekisda qoladi. */
  /* `position: relative` - "+" menyusi shu panelga nisbatan, uning ustida
     ochiladi. Chap ichki bo'shliq 14px edi; endi u yerda "+" tugmasi turadi. */
  .bar { position: relative; width: 100%; display: flex; align-items: flex-end; gap: 8px;
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    border-radius: 22px; padding: 6px;
    transition: border-color .2s, box-shadow .2s; }
  .bar:focus-within { border-color: rgba(111,92,255,.55); box-shadow: 0 0 0 3px rgba(111,92,255,.12); }

  .bar textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none;
    background: transparent; color: var(--fg); font: inherit; line-height: 1.45;
    padding: 9px 4px; margin: 0; max-height: 110px; overflow-y: auto;
    /* iOS Safari 16px dan kichik maydonga fokuslanganda sahifani
       KATTALASHTIRADI va Mini App ichida uni qaytarib bo'lmaydi. */
    font-size: 16px; }
  .bar textarea::placeholder { color: #6f6a85; }

  .send { flex: none; width: 38px; height: 38px; border: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; padding: 0;
    background: rgba(255,255,255,.08); color: var(--muted);
    transition: background .2s, color .2s; }
  /* Matn bor - yuborish mumkin; band - to'xtatish. Rang AYNI SHU ikki
     holatda kuchayadi, aks holda tugma doim "bosing" deb turaverardi. */
  .send.ready { background: var(--ok); color: #fff; }
  .send.busy { background: rgba(255,59,48,.18); color: #ff8b84; }
  .send:active { transform: scale(.94); }
  .send svg { width: 18px; height: 18px; }
  .send .ic-stop, .send.busy .ic-send { display: none; }
  .send.busy .ic-stop { display: block; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted);
    min-height: 18px; }
  .status.live { color: var(--accent); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .status.live .dot { animation: blink 1s ease-in-out infinite; }
  .note { font-size: 12.5px; color: #6f6a85; margin: 8px 0 0; text-align: center; }
  .note.warn { color: var(--warn); }
  .note.err { color: var(--accent); }

  /* ---------- bo'sh suhbat ---------- */
  .chat { flex: 1; position: relative; display: flex; min-height: 0; }
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 6px; text-align: center; padding: 0 12px; pointer-events: none; }
  .empty-title { margin: 0; font-size: 18px; font-weight: 700; }
  .empty-sub { margin: 0; font-size: 14px; color: var(--muted); max-width: 30ch; }

  /* ---------- transkript ---------- */
  /* ENDI ASOSIY MAYDON: `max-height: 30dvh` olib tashlandi, `flex: 1` qo'yildi.
     O'lcham ham kattalashtirildi - 14px/1.45 uzun javobni telefonda o'qishga
     qiyin edi. */
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    padding: 4px 2px 4px 0; scrollbar-width: thin; overscroll-behavior: contain; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; user-select: text; }
  .msg.you { align-self: flex-end; background: rgba(255,255,255,.08); border-bottom-right-radius: 4px; }
  .msg.venera { align-self: flex-start; background: rgba(120,100,255,.16); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: rgba(255,255,255,.05); color: var(--muted); font-size: 13px; }
  .msg .who { display: block; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .msg .src { display: block; margin-top: 7px; font-size: 12.5px; color: var(--muted); }
  /* Xabar vaqti. Veb ilovada sichqoncha ustida ko'rinadi; bu yerda DOIM,
     chunki sensorli ekranda "ustiga olib borish" yo'q - va suhbat
     ilovasida vaqt ko'rinib turishi odatiy. */
  .msg .at { display: block; margin-top: 5px; font-size: 11px; color: var(--muted); opacity: .75; }
  .msg.you .at { text-align: right; }
  .msg .files { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--fg); vertical-align: -2px; margin-left: 1px; animation: blink .8s steps(1) infinite; }

  /* ---------- boshqaruv ---------- */
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .btn { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 600; font-size: 15px;
    background: var(--ok); color: #fff; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: rgba(255,255,255,.08); color: var(--fg); }
  .btn.danger { background: rgba(255,59,48,.16); color: #ff8b84; }
  .btn.sm { padding: 8px 14px; font-size: 14px; }

  /* ---------- kirish ---------- */
  .auth { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 380px;
    width: 100%; margin: 0 auto; }
  .auth h1 { margin: 0; font-size: 24px; text-align: center; }
  .auth p.lead { margin: 0; color: var(--muted); text-align: center; font-size: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .field input { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; color: var(--fg); font: inherit; outline: none; width: 100%; }
  .field input:focus { border-color: rgba(111,92,255,.7); }
  .linkrow { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }

  /* ---------- menyu ---------- */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end;
    z-index: 10; padding: 0; }
  .sheet-body { background: #0e0c18; border-radius: 18px 18px 0 0; width: 100%; padding: 18px 16px calc(var(--safe-bottom) + 18px);
    display: flex; flex-direction: column; gap: 14px; max-height: 88dvh; overflow-y: auto; }
  .who-box { display: flex; flex-direction: column; gap: 2px; }
  .who-box .name { font-weight: 700; }
  .who-box .meta { font-size: 12.5px; color: var(--muted); }
  .sheet hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
  /* ---------- suhbatlar ---------- */
  .hist-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hist-title { font-weight: 700; font-size: 17px; }
  .hist-list { display: flex; flex-direction: column; gap: 2px; }
  .hist-label { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted);
    margin: 12px 4px 4px; }
  .hist-label:first-child { margin-top: 0; }
  .hist-row { display: flex; align-items: center; gap: 2px; border-radius: 12px; padding-right: 4px; }
  .hist-row.active { background: rgba(120,100,255,.16); }
  .hist-open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 11px 10px; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-row .iconbtn { flex: none; border-color: transparent; color: var(--muted); }
  .hist-input { flex: 1; min-width: 0; margin: 4px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(111,92,255,.7); border-radius: 10px; padding: 8px 10px; color: var(--fg);
    font: inherit; outline: none; user-select: text; }
  .hist-empty { margin: 0; padding: 16px 4px; color: var(--muted); font-size: 14px; text-align: center; }
  .hist-undo { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; font-size: 13.5px;
    color: var(--muted); }
  .hist-undo .link { color: var(--fg); }

  /* ---------- "+" tugmasi va menyusi ---------- */
  /* Veb ilovadagi `InputDock.vue` + `ComposerMenu.vue` nusxasi. Ochiq holatda
     45° buriladi (× - "yopish"). Menyu panel USTIDA ochiladi, sheet emas:
     u ikki qator xolos, butun ekranni qoplashi shart emas. */
  .plus { flex: none; width: 38px; height: 38px; border: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; padding: 0;
    background: rgba(255,255,255,.06); color: var(--muted);
    transition: background .2s, color .2s, transform .2s; }
  .plus svg { width: 18px; height: 18px; }
  .plus[aria-expanded="true"] { background: rgba(255,255,255,.12); color: var(--fg); transform: rotate(45deg); }
  .plus:active { transform: scale(.94); }
  .plus[aria-expanded="true"]:active { transform: rotate(45deg) scale(.94); }

  .cmenu { position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 5;
    min-width: 236px; max-width: calc(100vw - 32px); padding: 6px;
    background: #14111f; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); animation: fadeUp .18s ease both; }
  .cmenu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px;
    border: 0; border-radius: 10px; background: transparent; color: var(--fg);
    font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; }
  .cmenu-item:active, .cmenu-item.is-active { background: rgba(255,255,255,.08); }
  /* Rasm: yuklash hali yo'q, shuning uchun kulrang va bosilmaydi. */
  .cmenu-item.is-disabled { color: var(--muted); opacity: .6; cursor: default; }
  .cmenu-item.is-disabled:active { background: transparent; }
  .cmenu-item svg { width: 16px; height: 16px; flex: none; }
  .cmenu-label { flex: 1; white-space: nowrap; }
  .cmenu-hint { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .cmenu-item .cmenu-chev { width: 11px; height: 11px; color: var(--muted); transition: transform .2s; }
  .cmenu-item[aria-expanded="true"] .cmenu-chev { transform: rotate(90deg); }

  /* ---------- ulanishlar ro'yxati (HRM, CRM) ---------- */
  /* `ConnectorList.vue` nusxasi. Tor ekranda yon panel sig'maydi - ro'yxat
     "Ulanishlar" qatori OSTIDA ochiladi (veb ilovada ham mobilda shunday). */
  .clist { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; padding-top: 6px;
    border-top: 1px solid var(--line); }
  .crow { display: flex; align-items: center; gap: 8px; padding-right: 8px; border-radius: 10px; color: var(--muted); }
  .crow.is-on { color: var(--fg); }
  .crow.is-unavailable { opacity: .55; }
  .crow-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border: 0; border-radius: 10px; background: transparent; color: inherit; text-align: left; cursor: pointer; }
  .crow-main:disabled { cursor: default; }
  .crow-main svg { width: 16px; height: 16px; flex: none; }
  .crow-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .crow-name { font-size: 14px; font-weight: 600; }
  .crow-hint { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Yashil - ulangan, sariq - muddati tugagan (qayta kirish kerak). */
  .crow-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
  .crow-dot.is-expired { background: var(--warn); }
  /* Tishli g'ildirak - kalitning chap tomonida, kichik va jim: qatorning
     asosiy amali kalit, sozlama esa ikkinchi darajali. */
  .crow-gear { flex: none; width: 26px; height: 26px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
  .crow-gear:active { background: rgba(255,255,255,.08); color: var(--fg); }
  .crow-gear svg { width: 15px; height: 15px; }
  /* "+" - ulanish. Kalit bilan bir xil balandlikda, qator sakramasin. */
  .crow-connect { flex: none; width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.06);
    color: var(--muted); cursor: pointer; }
  .crow-connect:active { background: var(--ok); border-color: transparent; color: #fff; }
  .crow-connect:disabled { cursor: default; }
  .crow-connect svg { width: 14px; height: 14px; }
  /* Kalit. Tugma, chunki o'zi bosiladi (nom alohida tugma). Holat `aria-checked` da. */
  .switch { flex: none; box-sizing: content-box; width: 34px; height: 19px; padding: 0; border-radius: 999px;
    background: rgba(255,255,255,.1); border: 1px solid var(--line); position: relative; cursor: pointer;
    transition: background .2s, border-color .2s; }
  .switch[aria-checked="true"] { background: var(--ok); border-color: transparent; }
  .switch-knob { position: absolute; top: 1.5px; left: 1.5px; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .22s; }
  .switch[aria-checked="true"] .switch-knob { transform: translateX(15px); }
  .clist-note { margin: 4px 10px 2px; font-size: 11.5px; color: var(--warn); }

  /* ---------- ulanish oynasi ---------- */
  /* `ConnectorDialog.vue` nusxasi: login + parol, saytning o'zida. Parol
     serverga ketadi, server platformaga kiradi va tokenni O'ZIDA saqlaydi. */
  .cdlg { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(0,0,0,.55); animation: fadeIn .18s ease both; }
  .cdlg-card { position: relative; width: min(400px, 100%); margin: 0; padding: 22px; border-radius: 20px;
    background: #14111f; border: 1px solid var(--line); box-shadow: 0 16px 48px rgba(0,0,0,.6);
    animation: fadeUp .22s ease both; }
  .cdlg-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; display: grid; place-items: center;
    border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; padding: 0; }
  .cdlg-close:active { background: rgba(255,255,255,.08); color: var(--fg); }
  .cdlg-close svg { width: 16px; height: 16px; }
  .cdlg-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; padding-right: 30px; }
  .cdlg-badge { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
    background: var(--ok); color: #fff; }
  .cdlg-badge svg { width: 18px; height: 18px; }
  .cdlg-text { min-width: 0; }
  .cdlg-title { margin: 0 0 3px; font-size: 17px; font-weight: 700; line-height: 1.25; }
  .cdlg-sub { margin: 0; font-size: 13px; line-height: 1.4; color: var(--muted); overflow-wrap: anywhere; }
  .cdlg-error { text-align: left; margin: 0 0 12px; }
  .cdlg-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .cdlg-actions .btn { border-radius: 999px; padding: 10px 16px; font-size: 14px; }
  /* Tasdiq qadamida "Ha, uzish" to'ldirilgan: bu yerda qizil endi "ehtiyot
     bo'l" emas, "shuni qilyapsan" degan aniq tugma. */
  .btn.danger.filled { background: var(--accent); color: #fff; }

  /* ---------- taklif kartasi (yozuv amali) ---------- */
  /* `ActionCard.vue` nusxasi: javob OSTIDA, xabar pufakchasining ichida.
     `white-space: normal` - pufakcha `pre-wrap`, karta esa oddiy oqim. */
  .act { display: block; margin: 10px 0 2px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(0,0,0,.28); font-size: 13.5px; line-height: 1.45; white-space: normal; color: var(--fg); }
  /* Yakuniy holat rang bilan: yashil - bajarildi, sariq - muddati tugagan,
     qizil - yiqildi; rad etilgani kulrang qoladi. */
  .act.is-ok { border-color: rgba(87,211,140,.5); }
  .act.is-bad { border-color: rgba(255,59,48,.5); }
  .act.is-warn { border-color: rgba(255,209,102,.5); }
  .act-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .act-head > svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
  .act-title { font-weight: 600; }
  .act-platform { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
  .act-status { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
    border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); }
  .act-status svg { width: 12px; height: 12px; }
  .act-status.is-ok { color: var(--good); border-color: rgba(87,211,140,.5); }
  .act-status.is-bad { color: #ff8b84; border-color: rgba(255,59,48,.5); }
  .act-status.is-warn { color: var(--warn); border-color: rgba(255,209,102,.5); }
  .act-summary { margin: 0 0 8px; }
  .act-details { display: grid; grid-template-columns: fit-content(40%) 1fr; gap: 3px 12px; margin: 0 0 8px; font-size: 13px; }
  .act-details dt { color: var(--muted); overflow-wrap: anywhere; }
  .act-details dd { margin: 0; overflow-wrap: anywhere; }
  .act-from { color: #6f6a85; }
  .act-arrow { margin: 0 6px; color: #6f6a85; }
  .act-to { font-weight: 600; }
  .act-warnings { margin: 0 0 8px; padding-left: 18px; font-size: 12.5px; color: var(--warn); }
  .act-result { margin: 0; font-size: 12.5px; color: var(--muted); }
  .act-bad { margin: 0 0 8px; font-size: 12.5px; color: #ff8b84; }
  .act-foot { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .act-hint { font-size: 11.5px; color: #6f6a85; }
  .act-buttons { display: flex; gap: 8px; justify-content: flex-end; }
  .act-buttons .btn { border-radius: 999px; padding: 8px 14px; font-size: 13px; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: translate(var(--jx), var(--jy)) scale(1); } 50% { transform: translate(var(--jx), var(--jy)) scale(1.035); } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .orb::before, .cmenu, .cdlg, .cdlg-card { animation: none; } }
</style>
</head>
<body>

<!-- ======================= YUKLANMOQDA ======================= -->
<div class="view" id="bootView">
  <div class="stage">
    <div class="orb-wrap big idle"><div class="orb"></div></div>
  </div>
  <div class="caption"><p class="sub" id="bootText">Sessiya tekshirilmoqda…</p></div>
</div>

<!-- ======================= KIRISH ======================= -->
<div class="view" id="authView" hidden>
  <div class="auth">
    <div class="brand" style="justify-content:center">Venera <span class="spark">✦</span></div>
    <h1 id="authTitle">Kirish</h1>
    <p class="lead" id="authLead">HRM / CRM hisobingiz bilan kiring.</p>

    <form id="loginForm" autocomplete="on">
      <div class="field" style="margin-bottom:12px">
        <label for="login">Login</label>
        <input id="login" name="username" type="text" autocomplete="username" placeholder="y.mamajonov"
               autocapitalize="off" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="field" style="margin-bottom:16px">
        <label for="password">Parol</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" id="loginBtn" type="submit" style="width:100%">Kirish</button>
    </form>

    <p class="note err" id="authError" hidden></p>

    <div class="linkrow">
      <button class="link" id="signupLink" type="button">Ro'yxatdan o'tish</button>
      <button class="link" id="forgotLink" type="button">Parolni o'zgartirish</button>
    </div>
  </div>
</div>

<!-- ======================= ASOSIY ======================= -->
<!-- Tuzilish ATAYLAB shunday: SUHBAT asosiy maydon (flex:1), mikrofon esa
     pastdagi ixcham tugma. Avval teskarisi edi - katta doira ekranning
     yarmini olib, javob 30dvh ga siqilardi va uzun javobni o'qib bo'lmasdi. -->
<div class="view" id="appView" hidden>
  <div class="top">
    <div class="brand">Venera <span class="spark">✦</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="pill" id="modePill">Tayyor</div>
      <!-- Ovozli javob kaliti. YOZUVSIZ, faqat ikonka: "Ovozli javob" matni
           pill va menyu bilan birga tor telefonga sig'masdi. Holat ikonkaning
           o'zida ko'rinadi - o'chiq bo'lsa karnay chizib tashlanadi. -->
      <button class="iconbtn voice" id="voiceToggle" type="button"
              aria-pressed="true" aria-label="Ovozli javob" title="Ovozli javob">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z"/>
          <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path class="wave" d="M18.5 5.5a9 9 0 0 1 0 13"/>
          <path class="slash" d="M3.5 3.5l17 17"/>
        </svg>
      </button>
      <!-- Suhbatlar tarixi - veb ilovadagi yon panelning o'rni. -->
      <button class="iconbtn" id="historyBtn" type="button" aria-label="Suhbatlar" title="Suhbatlar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Menyu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <!-- Suhbat. Bo'sh holat LOG ICHIDA emas, yonida: `log.textContent = ''`
       (chiqishda) uni ham o'chirib yuborardi. -->
  <div class="chat">
    <div class="empty" id="logEmpty">
      <p class="empty-title">Savolingizni ayting</p>
      <p class="empty-sub">Yozing yoki mikrofonni bosib gapiring — Venera o'zi javob beradi.</p>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
  </div>

  <p class="note" id="note" hidden></p>

  <!-- Past ishonchli transkript: yuborishdan OLDIN tasdiq so'raladi. -->
  <div class="row" id="confirmRow" hidden>
    <button class="btn sm" id="confirmYes" type="button">Ha, shu</button>
    <button class="btn sm ghost" id="confirmNo" type="button">Yo'q, qayta</button>
  </div>

  <!-- Pastki dok: status qatori + kiritish paneli.
       Panel ichida "+" menyusi, MATN maydoni, yuborish tugmasi va mikrofon
       doirasi. Veb ilovadagi `InputDock.vue` dan farqi: dok ichidagi
       alohida mikrofon ikonkasi yo'q (doiraning o'zi mikrofon). "+" avval
       bu yerda YO'Q edi - veb'da u o'chirilgan turardi va tor ekranda
       ishlamaydigan tugma chalg'itardi; endi unda Ulanishlar bor. -->
  <div class="dock">
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Tayyor</span></div>

    <div class="bar" id="inputBar">
      <!-- "+" menyusi: rasm (tez orada) va Ulanishlar (HRM, CRM). Ochiq
           holatda 45° buriladi - × ("yopish"). -->
      <button class="plus" id="plusBtn" type="button" aria-label="Qo'shish" title="Qo'shish"
              aria-haspopup="menu" aria-expanded="false" aria-controls="cmenu">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      </button>

      <!-- Menyu panel ustida. Ro'yxat (HRM, CRM qatorlari) JS da chiziladi:
           u server holatiga bog'liq. -->
      <div class="cmenu" id="cmenu" role="menu" aria-label="Qo'shish" hidden>
        <button class="cmenu-item is-disabled" type="button" role="menuitem" aria-disabled="true" title="Tez orada">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="13" height="11" rx="2"/><circle cx="6.5" cy="7.2" r="1.3" stroke-width="1.3"/><path d="M3 13.2l3.6-3.6 2.6 2.6 2.3-2.3 3.5 3.5"/></svg>
          <span class="cmenu-label">Rasm qo'shish</span>
          <span class="cmenu-hint">Tez orada</span>
        </button>
        <button class="cmenu-item" id="cmenuConnectors" type="button" role="menuitem"
                aria-haspopup="menu" aria-expanded="false" aria-controls="clist">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 2.5V6M11.5 2.5V6"/><path d="M4.5 6h9v2.5a4.5 4.5 0 0 1-9 0V6z"/><path d="M9 13v2.5"/></svg>
          <span class="cmenu-label">Ulanishlar</span>
          <svg class="cmenu-chev" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 2l3 3-3 3"/></svg>
        </button>
        <div class="clist" id="clist" role="group" aria-label="Ulanishlar" hidden></div>
      </div>

      <textarea id="input" rows="1" maxlength="2000" enterkeyhint="send"
                placeholder="Veneradan istalgan narsani so‘rang…"
                autocapitalize="sentences" autocorrect="on" spellcheck="false"></textarea>

      <!-- Yuborish. Band bo'lganda AYNI SHU tugma "to'xtatish" bo'ladi -
           alohida tugma qo'shsak, ikkalasi ham deyarli doim o'chiq turardi. -->
      <button class="send" id="sendBtn" type="button" aria-label="Yuborish" title="Yuborish">
        <svg class="ic-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg class="ic-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>

      <div class="orb-wrap idle" id="orbWrap" role="button" tabindex="0" aria-label="Ovoz bilan so'rash">
        <div class="ripple" id="ripple"></div>
        <div class="orb"></div>
        <!-- Ikkita ikonka, almashishi FAQAT CSS bilan (holat sinfi orqali):
             mikrofon - odatda; to'rtburchak - javob o'qilayotganda yoki
             kutilayotganda, ya'ni bosish TO'XTATADI. -->
        <div class="icon mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5M8 22h8"/></svg></div>
        <div class="icon stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></div>
      </div>
    </div>
  </div>
</div>

<!-- ======================= ULANISH OYNASI ======================= -->
<!-- HRM / CRM ga kirish: login + parol. Ulangan bo'lsa - hisob va "Uzish"
     (ikki qadam: tasdiq bilan). Sarlavha, tugmalar va maydonlarning
     ko'rinishi JS da holatga qarab to'ldiriladi (`renderDialog`). -->
<div class="cdlg" id="cdlg" hidden>
  <form class="cdlg-card" id="cdlgForm" role="dialog" aria-modal="true" aria-labelledby="cdlgTitle" novalidate>
    <button class="cdlg-close" id="cdlgClose" type="button" aria-label="Yopish" title="Yopish">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.5 4.5l9 9M13.5 4.5l-9 9"/></svg>
    </button>
    <div class="cdlg-head">
      <span class="cdlg-badge" id="cdlgBadge" aria-hidden="true"></span>
      <div class="cdlg-text">
        <h2 class="cdlg-title" id="cdlgTitle"></h2>
        <p class="cdlg-sub" id="cdlgSub"></p>
      </div>
    </div>
    <p class="note err cdlg-error" id="cdlgError" hidden></p>
    <div id="cdlgFields">
      <div class="field" style="margin-bottom:10px">
        <label for="cLogin">Login</label>
        <input id="cLogin" name="username" type="text" autocomplete="username"
               autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field" style="margin-bottom:14px">
        <label for="cPassword">Parol</label>
        <input id="cPassword" name="password" type="password" autocomplete="current-password">
      </div>
    </div>
    <div class="cdlg-actions" id="cdlgActions"></div>
  </form>
</div>

<!-- ======================= MENYU ======================= -->
<div class="sheet" id="menuSheet" hidden>
  <div class="sheet-body">
    <div class="who-box">
      <span class="name" id="whoName">—</span>
      <span class="meta" id="whoMeta"></span>
    </div>
    <hr>
    <div id="pwBox" hidden>
      <div class="field" style="margin-bottom:10px">
        <label for="curPw">Joriy parol</label>
        <input id="curPw" type="password" autocomplete="current-password">
      </div>
      <div class="field" style="margin-bottom:12px">
        <label for="newPw">Yangi parol</label>
        <input id="newPw" type="password" autocomplete="new-password">
      </div>
      <button class="btn sm" id="pwSubmit" type="button" style="width:100%">Saqlash</button>
      <p class="note" id="pwNote" hidden style="text-align:left"></p>
    </div>
    <button class="btn ghost sm" id="pwOpen" type="button">Parolni o'zgartirish</button>
    <button class="btn danger sm" id="logoutBtn" type="button">Chiqish</button>
    <button class="link" id="menuClose" type="button">Yopish</button>
  </div>
</div>

<!-- ======================= SUHBATLAR ======================= -->
<!-- Ro'yxat serverdan (`/api/v1/chats`) - veb ilova bilan BIR XIL: bir hisob,
     bir ro'yxat. Qatorlar JS da quriladi (`app.js`, 12b-bo'lim). -->
<div class="sheet" id="historySheet" hidden>
  <div class="sheet-body">
    <div class="hist-head">
      <span class="hist-title">Suhbatlar</span>
      <button class="btn sm" id="newChatBtn" type="button">+ Yangi suhbat</button>
    </div>
    <div class="hist-list" id="histList"></div>
    <!-- O'chirildi, lekin YO'QOLMADI: 8 soniya qaytarish mumkin. `status` -
         skrin-rider ham aytadi. -->
    <div class="hist-undo" id="histUndo" role="status" hidden>
      <span>Suhbat o'chirildi</span>
      <button class="link" id="histUndoBtn" type="button">Bekor qilish</button>
    </div>
    <p class="note warn" id="histNote" hidden></p>
    <button class="link" id="historyClose" type="button">Yopish</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
