# Venera monorepo — CI kirish nuqtasi.
#
# GitLab faqat shu faylni avtomatik o'qiydi. Har bir app o'z CI faylini saqlaydi va
# shu yerdan keltiriladi. Yangi app qo'shilganda — pastga bitta `local:` qatori.
#
# MUHIM: `include: local:` yo'llari HAR DOIM repo ildizidan hisoblanadi, keltirilayotgan
# faylning yonidan emas. Shuning uchun ular to'liq yozilgan.
#
# Har bir job o'z papkasi o'zgargandagina ishlaydi (`rules: changes:`), shuning uchun
# desktop'ga tegadigan commit web image'ini qayta yig'maydi va aksincha.

include:
  - local: apps/web/.gitlab-ci.yml

stages:
  - build
  - deploy

# apps/desktop uchun CI hozircha yo'q: build Windows'da PowerShell orqali qo'lda
# bajariladi (apps/desktop/packaging/build.ps1). Windows runner qo'shilganda
# apps/desktop/.gitlab-ci.yml yaratib, yuqoridagi ro'yxatga qo'shing.
