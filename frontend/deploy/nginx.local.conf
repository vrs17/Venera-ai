# Internal / LAN reverse proxy + static host — PLAIN HTTP, no TLS.
#
# Use this for serving on a trusted internal network by IP (no domain, no certs).
# For public/production use deploy/nginx.conf instead (HTTPS + HSTS).
#
# Layout assumed:
#   - the contents of `dist/` are copied to /var/www/brb-assistant
#   - the Spring Boot backend is reachable FROM THIS HOST at http://10.10.50.9:8080
#
# WARNING: plain HTTP means identity (email, employee id, roles) and questions
# travel in CLEARTEXT on the wire. Acceptable only on a trusted internal segment.
# This matches SECURITY.md blocker #2 — move to HTTPS before any untrusted exposure.

server {
    listen 80 default_server;          # responds on any IP/hostname of this host
    server_name _;                     # or pin your host's IP, e.g. server_name 10.10.10.8;

    root /var/www/brb-assistant;
    index index.html;

    # --- Security headers that still apply over plain HTTP ---
    # (HSTS and Cross-Origin-Opener-Policy are HTTPS/secure-context only — omitted.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Content-Security-Policy (no 'upgrade-insecure-requests' — there is no HTTPS here).
    #   script-src: 'self' + the sha256 of the single inline bootstrap script in
    #     index.html. If you edit that inline script, recompute the hash (deploy/README.md).
    #   connect-src 'self': the API is same-origin (/api) in proxy mode.
    #   Google Fonts hosts are allowed; on an air-gapped network the font simply
    #   won't load (falls back to system sans-serif) — not a CSP error.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AyugZbBy9pdrDKbOBnyAL05a8s4MjNVfeXLUyu3t1Z4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # --- Hashed, immutable assets (filenames change on every build) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API → Spring Boot backend (must be reachable from THIS host) ---
    location /api/ {
        proxy_pass http://10.10.50.9:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # pipeline calls can be slow (LLM round-trips)
    }

    # --- SPA fallback: index.html must NOT be cached ---
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
