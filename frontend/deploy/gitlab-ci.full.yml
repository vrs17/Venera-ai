# .gitlab-ci.yml — full pipeline: check + build + MANUAL-gated deploy.
#
# Vue 3 + Vite 8 SPA, proxy mode (.env.production VITE_API_BASE="" => relative /api).
# Node pinned to 22 (matches local 22.22.3 / npm 10.9.8).
#
# EXECUTORS (two runner types, do not conflate):
#   - install/typecheck/build run on a DOCKER runner (default image below).
#   - deploy:production runs on a SHELL runner tagged `brb-deploy` that can reach
#     the web host and has rsync + ssh. A shell executor ignores image:, so deploy
#     sets `image: ""` to make that intent explicit and fail loudly if it is ever
#     mis-scheduled onto a Docker runner (node:22-slim has no rsync/ssh).
#
# DEPLOY IS MANUAL and double-gated: default branch only + `when: manual` + an
# explicit ALLOW_PROD_DEPLOY sign-off variable. It rsyncs dist/ to
# /var/www/brb-assistant — matching the committed deploy/nginx.conf (NOT brbtech-llm).
#
# PROXY MODE: the bundle calls relative /api. nginx MUST already serve
# /var/www/brb-assistant AND proxy /api -> backend. This pipeline ships static
# files ONLY; it never installs or reloads nginx. See deploy/nginx.conf.
#
# SECURITY.md RELEASE BLOCKERS (unresolved): (1) auth is UI-only — client-minted
# demo token, client-asserted roles; (2) backend transport is plaintext HTTP.
# The manual gate + ALLOW_PROD_DEPLOY guard + PROTECTED environment exist so this
# button cannot be pressed for public prod until both are closed. Make `production`
# a PROTECTED environment with an approval/allowed-deployers list in the GitLab UI.
#
# AIR-GAP (BRB is a bank): the runner may have no public egress. `npm ci` then needs
# an internal registry (set npm_config_registry via a CI variable) or an offline
# cache, and node:22-bookworm-slim must come from an internal/proxied registry.
# Validate egress before the first run.

default:
  image: node:22-bookworm-slim   # Node 22.x for Docker-executor jobs. Pin by digest for full reproducibility.

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_fund: "false"
  npm_config_audit: "false"
  DEPLOY_PATH: "/var/www/brb-assistant"   # MUST match deploy/nginx.conf root.

# Avoid duplicate MR + branch pipelines. (No tag arm: nothing here is tag-triggered,
# and every job is branch/MR-scoped — admitting tags would create a 0-job pipeline.)
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - install
  - check
  - build
  - deploy

# Cache npm's download cache (~/.npm redirected to .npm) keyed on package-lock.json.
# We do NOT cache node_modules (`npm ci` rebuilds it deterministically). dist/ moves
# from build -> deploy via ARTIFACTS, not cache: artifacts are the reliable contract
# for build outputs; cache is a best-effort speedup that may be evicted.
.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

install:
  stage: install
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  cache:
    <<: *npm_cache
    policy: pull-push
  script:
    - npm ci
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/        # deterministically forwarded to check/build

# Fast-feedback type-check. `npm run build` ALREADY runs `vue-tsc -b`, so this is
# redundant for the build itself — kept so type errors surface in a short, clearly
# named job. Remove to save a runner minute if you'd rather rely on build's tsc pass.
typecheck:
  stage: check
  interruptible: true
  needs: ["install"]         # receives node_modules/ artifact from install
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  cache:
    <<: *npm_cache
    policy: pull
  script:
    - npx vue-tsc -b         # no package.json script needed (none exists); matches build's tsc step

build:
  stage: build
  interruptible: true
  needs: ["install", "typecheck"]   # receives node_modules/ from install
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  cache:
    <<: *npm_cache
    policy: pull
  script:
    # vue-tsc -b && vite build, using committed .env.production (proxy mode).
    - npm run build
  artifacts:
    name: "dist-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week        # must exceed any manual-approval delay so the gate
    paths:                   # cannot expire the artifact out from under a slow approval
      - dist/                # the ONLY thing deploy consumes

# MANUAL-gated deploy, default branch only, to the PROTECTED `production` environment.
# Runs on a shell runner (tag brb-deploy) — no image, no Node; just rsync over ssh.
# NOT interruptible: never cancel a deploy mid-flight (rsync is in-place).
deploy:production:
  stage: deploy
  image: ""                  # shell executor: make the no-container intent explicit; fail loudly on Docker
  interruptible: false
  resource_group: production # serialize deploys — never two concurrent rsyncs to the same web root
  environment:
    name: production         # make this a PROTECTED environment (approvals + allowed-deployers) in the UI
    url: https://assistant.brb.uz   # server_name in deploy/nginx.conf
  tags:
    - brb-deploy             # shell runner that can reach the web host + has rsync/ssh
  needs:
    - job: build
      artifacts: true        # pull dist/ from build only
  rules:
    # Default branch only, manual, AND an explicit sign-off variable. `when: manual`
    # governs auto-run-vs-click, NOT authorization — pair it with a PROTECTED env and
    # PROTECTED CI/CD variables so only authorized deployers on a protected ref can run.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ALLOW_PROD_DEPLOY == "true"'
      when: manual
  variables:
    # Set as PROTECTED + MASKED CI/CD variables (Settings > CI/CD > Variables),
    # available only on protected refs:
    #   DEPLOY_HOST       e.g. webhost.internal
    #   DEPLOY_USER       e.g. deployer (must be able to write $DEPLOY_PATH)
    #   SSH_PRIVATE_KEY   File-type; key authorized on DEPLOY_HOST
    #   SSH_KNOWN_HOSTS   File-type; pinned host key (ssh-keyscan DEPLOY_HOST) — no TOFU
    #   ALLOW_PROD_DEPLOY set to "true" only after security sign-off (SECURITY.md blockers)
    GIT_STRATEGY: none       # no repo checkout needed; we only ship the dist/ artifact
  before_script:
    # Write key + known_hosts into a private, job-scoped temp dir (never CI_PROJECT_DIR).
    - export SSH_DIR="$(mktemp -d)"
    - install -m 600 "$SSH_PRIVATE_KEY" "$SSH_DIR/id"
    - install -m 600 "$SSH_KNOWN_HOSTS" "$SSH_DIR/known_hosts"
  script:
    - test -f dist/index.html   # fail fast if the build artifact did not arrive
    # --delete makes the web root EXACTLY match dist/ (old hashed assets pruned).
    # Trailing slash on dist/ copies its CONTENTS into $DEPLOY_PATH.
    # Pinned known_hosts + StrictHostKeyChecking=yes: no first-connection MITM window.
    - >
      rsync -az --delete
      -e "ssh -i $SSH_DIR/id -o UserKnownHostsFile=$SSH_DIR/known_hosts -o StrictHostKeyChecking=yes"
      dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    # PROXY MODE: nginx must already serve $DEPLOY_PATH and proxy /api (deploy/nginx.conf).
    # If you edited the inline bootstrap script in index.html, recompute the CSP sha256
    # (deploy/README.md) before deploying or the page will not boot.
  after_script:
    # Runs even if rsync fails — never leave a private key on a shared shell runner.
    - shred -u "$SSH_DIR/id" 2>/dev/null || rm -f "$SSH_DIR/id"
    - rm -rf "$SSH_DIR"
