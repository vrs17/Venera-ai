# Production reverse proxy + static host for the BRB-Tech Assistant frontend.
#
# Layout assumed:
#   - the contents of `dist/` are copied to /var/www/brb-assistant
#   - the Spring Boot backend is reachable at http://10.10.50.9:8080
#
# This server: terminates TLS, serves the hashed static bundle, forwards /api to
# the backend (proxy mode — matches .env.production), and sends hardened security
# headers. Adjust server_name and certificate paths for your environment.

# Redirect all plaintext HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name assistant.brb.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name assistant.brb.uz;

    # --- TLS ---
    ssl_certificate     /etc/ssl/certs/brb-assistant.crt;
    ssl_certificate_key /etc/ssl/private/brb-assistant.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/brb-assistant;
    index index.html;

    # --- Security headers (sent on every response) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content-Security-Policy.
    #   script-src: 'self' for the hashed bundle + the sha256 of the single inline
    #     bootstrap script in index.html (theme/locale pre-paint). If you edit that
    #     inline script, recompute the hash (see deploy/README.md) or the page breaks.
    #   style-src / font-src: allow the Google Fonts stylesheet + font files.
    #     Self-host the font to drop these two hosts entirely (recommended).
    #   connect-src 'self': the API is same-origin (/api) in proxy mode.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AyugZbBy9pdrDKbOBnyAL05a8s4MjNVfeXLUyu3t1Z4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

    # --- Hashed, immutable assets (filenames change on every build) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API → Spring Boot backend ---
    location /api/ {
        proxy_pass http://10.10.50.9:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # pipeline calls can be slow (LLM round-trips)
    }

    # --- SPA fallback: index.html must NOT be cached ---
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
